[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loger"
version = "0.1.0"
description = "LoGeR core library for long-context geometric reconstruction."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "LoGeR Authors" },
]
dependencies = [
  "torch>=2.7.0",
  "torchvision>=0.21.0",
  "numpy>=1.26.4",
  "Pillow>=11.3.0",
  "opencv-python<=4.13.0.92",
  "plyfile>=1.1.3",
  "huggingface-hub>=1.8.0",
  "safetensors>=0.7.0",
  "natsort>=8.4.0",
  "einops>=0.8.2",
  "gradio>=4.44.1",
  "trimesh>=4.11.5",
  "matplotlib>=3.9.4",
  "scipy>=1.13.1",
  "viser>=1.0.26",
  "roma>=1.5.6",
  "evo>=1.31.1",
  "accelerate>=1.10.1",
  "requests>=2.32.5",
  "tqdm>=4.67.3",
  "omegaconf>=2.3.0",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
onnx = [
  "onnxruntime==1.20.1",
]
xformers = [
  "xformers==0.0.29.post3",
]
all = [
  "onnxruntime==1.20.1",
  "xformers==0.0.29.post3",
]

[project.urls]
Homepage = "https://loger-project.github.io/"
Repository = "https://github.com/junyi42/LoGeR"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
